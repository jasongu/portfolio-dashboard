/* ----------------------------------------------------------------------------
   FORMATTERS
---------------------------------------------------------------------------- */
const MINUS = '\u2212';
function money(n){ if(state.privacy) return '$\u2022\u2022\u2022\u2022'; return (n<0?MINUS+'$':'$') + Math.abs(Math.round(n)).toLocaleString(); }

function pct(n){ if(!isFinite(n)) return '—'; return (n>=0?'+':MINUS) + Math.abs(n*100).toFixed(2) + '%'; }
function price(n){ return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function colClass(n){ return n>=0 ? 'gl-gain' : 'gl-loss'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ----------------------------------------------------------------------------
   DERIVED CALCULATIONS  (canonical formulas from the design handoff)
---------------------------------------------------------------------------- */
function derive(){
  const lots = HOLDINGS.map(l => {
    const q = state.quotes[l.t] || { price:l.cost, prev:l.cost, beta:0, pe:0 };
    const price = q.price, prev = q.prev;
    const value = l.shares*price;
    const dayd  = l.shares*(price-prev);
    const daypct= prev ? (price-prev)/prev : 0;
    const gl    = l.shares*(price-l.cost);
    const glpct = l.cost ? (price-l.cost)/l.cost : 0;
    const costv = l.shares*l.cost;
    return { ...l, price, prev, beta:q.beta||0, pe:q.pe||0, value, dayd, daypct, gl, glpct, costv };
  });
  const isCash = t => CASH_TICKERS.includes(t);
  const totalValue = lots.reduce((a,b)=>a+b.value,0);
  const prevValue  = lots.reduce((a,b)=>a+b.shares*b.prev,0);
  const todayGL    = totalValue - prevValue;
  const todayPct   = prevValue ? todayGL/prevValue : 0;
  const costBasis  = lots.reduce((a,b)=>a+b.costv,0);
  const totalGL    = totalValue - costBasis;
  const totalGLpct = costBasis ? totalGL/costBasis : 0;
  // weighted beta over non-cash lots only
  const betaLots = lots.filter(l=>!isCash(l.t));
  const betaVal  = betaLots.reduce((a,b)=>a+b.value,0);
  const wbeta    = betaVal ? betaLots.reduce((a,b)=>a+b.value*b.beta,0)/betaVal : 0;
  const peL      = lots.filter(l=>l.pe>0 && !isCash(l.t));
  const peVal    = peL.reduce((a,b)=>a+b.value,0);
  const wpe      = peVal ? peL.reduce((a,b)=>a+b.value*b.pe,0)/peVal : 0;
  const brokTotal= lots.filter(l=>l.acct==='brok').reduce((a,b)=>a+b.value,0);
  const iraTotal = totalValue - brokTotal;

  const map = {};
  lots.forEach(l => {
    if(!map[l.t]) map[l.t] = { t:l.t, name:l.name, price:l.price, prev:l.prev, daypct:l.daypct, beta:l.beta, pe:l.pe, brok:0, ira:0, value:0, dayd:0, gl:0, costv:0, shares:0, accts:new Set() };
    const g = map[l.t];
    if(l.acct==='brok') g.brok += l.value; else g.ira += l.value;
    g.value += l.value; g.dayd += l.dayd; g.gl += l.gl; g.costv += l.costv; g.shares += l.shares; g.accts.add(l.acct);
  });
  const byTicker = Object.values(map).map(g => ({
    ...g, glpct: g.costv ? g.gl/g.costv : 0, acctN: g.accts.size,
    pctPort: totalValue ? g.value/totalValue : 0, avgCost: g.shares ? g.costv/g.shares : 0,
    isCash: isCash(g.t)
  })).sort((a,b)=>b.value-a.value);

  return { lots, totalValue, prevValue, todayGL, todayPct, costBasis, totalGL, totalGLpct, wbeta, wpe, brokTotal, iraTotal, byTicker };
}

function acctLabel(g){
  const b = g.accts ? g.accts.has('brok') : g.brok>0;
  const i = g.accts ? g.accts.has('ira')  : g.ira>0;
  return b && i ? 'Brok · IRA' : b ? 'Brok' : 'IRA';
}

/* ---------- AI Analyst: deterministic computed answers (offline) ---------- */
function analystAnswer(d){
  const inv = d.byTicker.filter(g=>!g.isCash);
  const ans = {};
  if(inv.length){
    const best = inv.reduce((a,b)=>b.daypct>a.daypct?b:a);
    const worst= inv.reduce((a,b)=>b.daypct<a.daypct?b:a);
    ans.best  = `${best.t} leads today at ${pct(best.daypct)} (${signed(best.dayd)}).`;
    ans.worst = `${worst.t} is the drag, down ${pct(worst.daypct)} (${signed(worst.dayd)}).`;
  }
  ans.beta = `Weighted beta is ${d.wbeta.toFixed(2)} — ${d.wbeta>1.05?'more volatile than the market':d.wbeta<0.95?'calmer than the market':'roughly in line with the market'}.`;
  const top3 = inv.slice(0,3);
  const top3Sum = top3.reduce((a,b)=>a+b.pctPort,0);
  if(inv.length) ans.conc = `Largest position is ${inv[0].t} at ${(inv[0].pctPort*100).toFixed(1)}% of the book; the top 3 (${top3.map(g=>g.t).join(', ')}) are ${(top3Sum*100).toFixed(1)}% combined.`;
  const bP = d.totalValue?d.brokTotal/d.totalValue*100:0;
  ans.split = `Brokerage is ${money(d.brokTotal)} (${bP.toFixed(1)}%) and retirement is ${money(d.iraTotal)} (${(100-bP).toFixed(1)}%).`;
  return ans;
}

/* deterministic per-ticker pseudo history ending at current price (fallback) */
function chartSeries(ticker, range, endPrice){
  if(state.chartCache && state.chartCache[ticker+range]) return state.chartCache[ticker+range];
  const counts = { '1M':22, '6M':126, '1Y':252, 'ALL':504 };
  const n = counts[range] || 126;
  let seed = 0; for(const c of ticker) seed = (seed*31 + c.charCodeAt(0)) % 100000;
  const rng = () => { seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; };
  const vol = 0.012 + (seed%7)*0.002;
  const arr = []; let v = endPrice || 1;
  for(let i=0;i<n;i++) arr.push(v *= (1 + (rng()-0.5)*vol*2));
  const scale = (endPrice||1)/arr[arr.length-1];
  const today = new Date();
  const series = arr.map((x,i)=>{
    const dt = new Date(today); dt.setDate(today.getDate() - (n-1-i));
    const label = range==='1M' ? (dt.getMonth()+1)+'/'+dt.getDate()
                : dt.toLocaleString(undefined,{month:'short'})+" '"+String(dt.getFullYear()).slice(2);
    return { v:x*scale, label };
  });
  state.chartCache = state.chartCache || {};
  state.chartCache[ticker+range] = series;
  return series;
}

function freeAnswer(q, d, ans){
  const s = q.toLowerCase();
  if(/best|winner|up/.test(s) && ans.best) return ans.best;
  if(/drag|worst|down|loser/.test(s) && ans.worst) return ans.worst;
  if(/beta|volatil/.test(s)) return ans.beta;
  if(/concentrat|diversif|biggest|largest/.test(s) && ans.conc) return ans.conc;
  if(/broker|retire|ira|split/.test(s)) return ans.split;
  if(/value|worth|total/.test(s)) return `Your ledger is worth ${money(d.totalValue)} — ${signed(d.todayGL)} today, ${signed(d.totalGL)} all-time.`;
  return `I can speak to today's best/worst movers, your weighted beta, concentration, account split, or total value. Try one of the prompts above.`;
}

/* ============================================================================
   IMPORT PIPELINE  (CSV / Excel, Chase total-cost handling, sweep -> CASH)
   ============================================================================ */
const SWEEP_HINTS = ['sweep','deposit sweep','jpmpd','money market','cash & cash','us dollar','cash balance'];
function readImportFile(acct, file){
  const reader = new FileReader();
  const isX = /\.(xlsx|xls)$/i.test(file.name);
  reader.onload = e => {
    try{
      let headers, rows;
      if(isX){
        const wb = XLSX.read(e.target.result, { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
        const hi = data.findIndex(r => r.filter(c=>String(c).trim()).length > 1);
        headers = data[hi].map(c=>String(c).trim());
        rows = data.slice(hi+1).filter(r=>r.some(c=>String(c).trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'').trim()])));
      } else {
        const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim());
        headers = parseCsv(lines[0]);
        rows = lines.slice(1).map(l=>{ const v=parseCsv(l); return Object.fromEntries(headers.map((h,i)=>[h,(v[i]??'').trim()])); }).filter(r=>Object.values(r).some(v=>v));
      }
      state.importData[acct] = { headers, rows, filename:file.name };
      render();
    }catch(err){ importMsg('Error reading '+file.name+': '+err.message); }
  };
  if(isX) reader.readAsArrayBuffer(file); else reader.readAsText(file);
}
function parseCsv(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(c==='"'){ q=!q; } else if(c===','&&!q){ out.push(cur); cur=''; } else cur+=c; }
  out.push(cur); return out.map(s=>s.trim().replace(/^"|"$/g,''));
}
function importMsg(m){ const el=document.getElementById('importMsg'); if(el) el.textContent=m; }
const COL_HINTS = {
  ticker:['ticker','symbol','symb','stock','security'],
  shares:['shares','quantity','qty','units','position'],
  name:['name','description','security name','holding'],
  cost:['cost basis/share','avg cost','avg price','price/share','unit cost','cost per share'],
  totalcost:['total cost','orig cost','original cost','total basis','cost basis','book value','amount invested']
};
function guess(headers, field){ const h=COL_HINTS[field]; return headers.find(x=>h.some(k=>x.toLowerCase().includes(k)))||''; }
function num(s){ return parseFloat(String(s).replace(/[^0-9.\-]/g,''))||0; }

function applyImport(){
  const out = [];
  let cashByAcct = { brok:0, ira:0 };
  ['brok','ira'].forEach(acct => {
    const data = state.importData[acct];
    if(!data) return;
    const cT = guess(data.headers,'ticker'), cS = guess(data.headers,'shares'),
          cN = guess(data.headers,'name'), cC = guess(data.headers,'cost'), cTC = guess(data.headers,'totalcost');
    data.rows.forEach(r => {
      const tickRaw = (r[cT]||'').toUpperCase().trim();
      const name = cN ? r[cN] : '';
      const shares = num(r[cS]);
      const looksCash = SWEEP_HINTS.some(h => (tickRaw+' '+name).toLowerCase().includes(h)) || ['QACDS','QDERQ','CWMPD','QAJDS','JPMPD'].includes(tickRaw);
      if(looksCash){
        // fold sweep/dollar into the account's CASH bucket
        const dollars = cTC ? num(r[cTC]) : (shares || num(r[cC])*shares);
        cashByAcct[acct] += (dollars || shares);
        return;
      }
      if(!tickRaw || !shares) return;
      let cost;
      if(cTC && num(r[cTC])) cost = num(r[cTC]) / shares;       // Chase total cost
      else if(cC && num(r[cC])) cost = num(r[cC]);              // per-share
      else cost = 0;
      out.push({ t:tickRaw, name:name||tickRaw, shares, cost:+cost.toFixed(4), acct });
    });
  });
  // add cash positions
  if(cashByAcct.brok>0) out.push({ t:'CASH',  name:'US Dollar (incl. Chase Deposit Sweep)', shares:+cashByAcct.brok.toFixed(2), cost:1.00, acct:'brok' });
  if(cashByAcct.ira>0)  out.push({ t:'RCASH', name:'US Dollar (retirement sweep)',          shares:+cashByAcct.ira.toFixed(2),  cost:1.00, acct:'ira' });

  if(!out.length){ importMsg('No rows mapped — check that the file has Ticker and Shares columns.'); return; }
  HOLDINGS.length = 0; out.forEach(o => HOLDINGS.push(o));
  state.quotes = {}; Object.keys(liveStdev).forEach(k=>delete liveStdev[k]); stdevStale.clear(); seedQuotes();
  state.importData = { brok:null, ira:null };
  state.showImport = false;
  saveHoldings();
  render();
  refreshAll();
}

let db = null;
async function initFirebase(){
  if(!CONFIG.FIREBASE || !CONFIG.FIREBASE.projectId) return false;
  try{
    const appMod = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const fsMod  = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const app = appMod.initializeApp(CONFIG.FIREBASE);
    db = { fs:fsMod, ref:fsMod.getFirestore(app) };
    return true;
  }catch(e){ console.warn('[firebase] init failed, falling back to embedded:', e); return false; }
}

/* Firestore helpers — same schema as the old app (JSON in a `data` field) */
const FB = {
  async loadHoldings(){ const {doc,getDoc}=db.fs; const s=await getDoc(doc(db.ref,'portfolio','holdings')); return s.exists()?JSON.parse(s.data().data):null; },
  async saveHoldings(arr){ const {doc,setDoc}=db.fs; await setDoc(doc(db.ref,'portfolio','holdings'),{data:JSON.stringify(arr),updatedAt:Date.now()}); },
  async loadStdev(p){ const {doc,getDoc}=db.fs; const s=await getDoc(doc(db.ref,'portfolio',`stdev_${p}`)); return s.exists()?JSON.parse(s.data().data):null; },
  async saveStdev(p,payload){ const {doc,setDoc}=db.fs; await setDoc(doc(db.ref,'portfolio',`stdev_${p}`),{data:JSON.stringify(payload),updatedAt:Date.now()}); },
};

/* normalize between the old field names (t/n/sh/ac/acct) and the new model */
function normHolding(h){
  const a = (h.acct==='brok'||h.acct==='Brokerage') ? 'brok'
          : (h.acct==='ira' ||h.acct==='Retirement') ? 'ira'
          : String(h.acct||'').toLowerCase().startsWith('b') ? 'brok' : 'ira';
  return { t:h.t, name:(h.name!=null?h.name:h.n)||h.t, shares:+(h.shares!=null?h.shares:h.sh)||0, cost:+(h.cost!=null?h.cost:h.ac)||0, acct:a };
}
function denormHolding(h){ return { t:h.t, n:h.name, sh:h.shares, ac:h.cost, acct:h.acct==='brok'?'Brokerage':'Retirement' }; }

function rebuildCashTickers(){
  CASH_TICKERS.length = 0;
  HOLDINGS.forEach(h => {
    const nm = (h.name||'').toLowerCase();
    if(h.t==='CASH'||h.t==='RCASH'||h.t==='JPMPD'||nm.includes('cash')||nm.includes('sweep')||nm.includes('premium deposit'))
      if(!CASH_TICKERS.includes(h.t)) CASH_TICKERS.push(h.t);
  });
}

/* Firestore is the source of truth when a holdings doc exists; the embedded
   HOLDINGS array is only the seed/fallback (matches portfolio_dashboard_v260610_1). */
async function loadHoldingsFromFirestore(){
  if(!db) return false;
  try{
    const remote = await FB.loadHoldings();
    if(remote && remote.length){
      HOLDINGS.length = 0;
      remote.forEach(r => HOLDINGS.push(normHolding(r)));
      rebuildCashTickers();
      seedQuotes();
      console.log('[firebase] loaded', remote.length, 'holdings (Firestore is source of truth)');
      return true;
    }
    console.log('[firebase] no holdings doc — using embedded HOLDINGS as seed/fallback');
  }catch(e){ console.warn('[firebase] holdings load failed', e); }
  return false;
}
async function saveHoldings(){
  if(!db) return;
  try{ await FB.saveHoldings(HOLDINGS.map(denormHolding)); console.log('[firebase] holdings saved'); }
  catch(e){ console.warn('[firebase] holdings save failed', e); }
}

      const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${k}&token=${CONFIG.FINNHUB_KEY}`);
      const j = await r.json();
      const chg = j.pc ? (j.c-j.pc)/j.pc : 0;
      out.push({ k, name, v: j.c?j.c.toFixed(2):'—', chg: pct(chg), up: chg });
    }catch(e){ out.push({ k, name, v:'—', chg:'—', up:0 }); }
  }
  state.indices = out; render();
}
async function fetchNews(force){
  if(!CONFIG.FINNHUB_KEY) return;
  try{
    const r = await fetch(`https://finnhub.io/api/v1/news?category=general&token=${CONFIG.FINNHUB_KEY}`);
    const j = await r.json();
    state.news = (j||[]).slice(0,5).map(a=>({
      source:a.source, time:new Date(a.datetime*1000).toLocaleDateString(),
      ticker:a.related? a.related.split(',')[0]:'MKT', up:0, headline:a.headline, snippet:a.summary, url:a.url
    }));
    render();
  }catch(e){}
}
function refreshAll(){ fetchPrices(); fetchMetrics(); fetchNews(); fetchAllStdev(); fetchRates(); }

/* ----------------------------------------------------------------------------
   Rate boxes:
   - Yields (DGS1/DGS5/DGS10) come live from Twelve Data (symbols US1Y/US5Y/US10Y),
     client-side on your existing key — no FRED / Cloud Function / CORS needed.
   - Term premia (TP1/TP5/TP10) are NOT available from Twelve Data or Finnhub
     (Fed-model series), so they're read from the Firestore portfolio/rates doc
     written by the FRED Cloud Function. Yields fetch fresh each load, so they are
     not written back to Firestore (no write conflict with the function's TP).
---------------------------------------------------------------------------- */
const YIELD_SYMS = { DGS1:'US1Y', DGS5:'US5Y', DGS10:'US10Y' };
async function loadRatesFromFirestore(){
  if(!db) return false;
  try{
    const { doc, getDoc } = db.fs;
    const s = await getDoc(doc(db.ref,'portfolio','rates'));
    if(s.exists()){ state.rates = { ...state.rates, ...JSON.parse(s.data().data) }; console.log('[rates] term premia loaded from Firestore'); render(); return true; }
    console.log('[rates] no rates doc yet — term premia show — until the FRED function writes portfolio/rates');
  }catch(e){ console.warn('[rates] Firestore load failed', e); }
  return false;
}
async function fetchYieldsFromTwelve(){
  if(!CONFIG.TWELVE_KEY) return;
  try{
    const syms = Object.values(YIELD_SYMS).join(',');   // one batched call
    const r = await fetch(`https://api.twelvedata.com/quote?symbol=${syms}&apikey=${CONFIG.TWELVE_KEY}`);
    const j = await r.json();
    const pick = sym => {
      const o = j[sym] || (j.symbol===sym ? j : null);   // multi vs single shape
      if(!o) return null;
      const v = parseFloat(o.close ?? o.price);
      return isNaN(v) ? null : v;
    };
    let changed = false;
    for(const [field, sym] of Object.entries(YIELD_SYMS)){ const v = pick(sym); if(v!=null){ state.rates[field] = v; changed = true; } }
    if(changed){ console.log('[yields] from Twelve Data:', YIELD_SYMS); render(); }
    else console.warn('[yields] Twelve Data returned no usable values', j);
  }catch(e){ console.warn('[yields] Twelve Data failed', e); }
}
async function fetchRates(){ await loadRatesFromFirestore(); await fetchYieldsFromTwelve(); }

/* ============================================================================
   STANDARD DEVIATION  — Firebase-first, per-ticker staleness (ported from old file)
   liveStdev[t] = { s7, s30, s252 } where each is the sample std-dev of the last
   7 / 30 / 252 daily LOG returns. Displayed as (value*100).toFixed(2)+'%'.
   Staleness: s7 daily, s30 weekly, s252 monthly. outputsize scales to the
   longest stale window (10 / 35 / 260 bars). Firebase updated after each ticker.
   Firestore docs: portfolio/stdev_7d , stdev_30d , stdev_252d
   ============================================================================ */
const liveStdev = {};
const STDEV_DOCS = {};
const stdevStale = new Set();
const delay = ms => new Promise(r => setTimeout(r, ms));
function stddev(arr){ if(!arr||arr.length<2) return null; const m=arr.reduce((a,b)=>a+b,0)/arr.length; const v=arr.reduce((s,x)=>s+(x-m)**2,0)/(arr.length-1); return Math.sqrt(v); }
function stdevPeriodKey(){
  const today    = new Date().toISOString().slice(0,10);
  const weekKey  = (()=>{ const d=new Date(); d.setDate(d.getDate()-d.getDay()); return d.toISOString().slice(0,10); })();
  const monthKey = new Date().toISOString().slice(0,7);
  return { today, weekKey, monthKey };
}
async function loadAllStdevFromFirebase(){
  if(!db) return;
  await Promise.all(['7d','30d','252d'].map(async p => {
    const doc = await FB.loadStdev(p);
    if(doc){ if(!doc.data) doc.data={}; if(!doc.updatedAt) doc.updatedAt={}; STDEV_DOCS[p]=doc; }
  }));
  const pull = (p, sf, mf) => {
    for(const [t,v] of Object.entries(STDEV_DOCS[p]?.data || {})){
      if(v[sf]==null && v[mf]==null) continue;
      liveStdev[t] = liveStdev[t] || {};
      if(v[sf]!=null) liveStdev[t][sf] = v[sf];
      if(v[mf]!=null) liveStdev[t][mf] = v[mf];
    }
  };
  pull('7d','s7','ma7'); pull('30d','s30','ma30'); pull('252d','s252','ma252');
  console.log('[stdev] loaded from Firebase:', Object.keys(liveStdev).length, 'tickers');
}
function getStaleTickersForPeriod(period){
  const { today, weekKey, monthKey } = stdevPeriodKey();
  const ua = (STDEV_DOCS[period]||{}).updatedAt || {};
  const tickers = [...new Set(HOLDINGS.map(h=>h.t))].filter(t=>!CASH_TICKERS.includes(t));
  return tickers.filter(t => {
    const ts = ua[t];
    if(!ts) return true;
    if(period==='7d')   return ts !== today;
    if(period==='30d')  return ts !== weekKey;
    if(period==='252d') return ts !== monthKey;
    return true;
  });
}
async function fetchAndSaveStdevForTicker(ticker, stale7, stale30, stale252){
  if(CASH_TICKERS.includes(ticker)) return false;
  let outputsize = 10;
  if(stale30)  outputsize = 35;
  if(stale252) outputsize = 260;
  for(let attempt=0; attempt<=2; attempt++){
    try{
      if(attempt>0) await delay(8000);
      const url = `https://api.twelvedata.com/time_series?symbol=${ticker}&interval=1day&outputsize=${outputsize}&apikey=${CONFIG.TWELVE_KEY}`;
      console.log(`[stdev] fetching ${ticker} (outputsize=${outputsize})${attempt>0?` retry ${attempt}`:''}`);
      const r = await fetch(url, { signal:AbortSignal.timeout(10000) });
      const d = await r.json();
      if(!d || d.status==='error' || !d.values || d.values.length < 8){ continue; }
      const closes = [...d.values].reverse().map(v=>parseFloat(v.close));
      const rets = [];
      for(let i=1;i<closes.length;i++) rets.push(Math.log(closes[i]/closes[i-1]));
      liveStdev[ticker] = liveStdev[ticker] || {};
      const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
      if(stale7)   { const s=stddev(rets.slice(-7));   if(s!=null) liveStdev[ticker].s7=s;   const m=mean(closes.slice(-7));   if(m!=null) liveStdev[ticker].ma7=m; }
      if(stale30)  { const s=stddev(rets.slice(-30));  if(s!=null) liveStdev[ticker].s30=s;  const m=mean(closes.slice(-30));  if(m!=null) liveStdev[ticker].ma30=m; }
      if(stale252) { const s=stddev(rets.slice(-252)); if(s!=null) liveStdev[ticker].s252=s; const m=mean(closes.slice(-252)); if(m!=null) liveStdev[ticker].ma252=m; }
      const { today, weekKey, monthKey } = stdevPeriodKey();
      const updates = [
        stale7   && ['7d',   ['s7','ma7'],     today],
        stale30  && ['30d',  ['s30','ma30'],   weekKey],
        stale252 && ['252d', ['s252','ma252'], monthKey],
      ].filter(Boolean);
      for(const [p, fields, ts] of updates){
        STDEV_DOCS[p] = STDEV_DOCS[p] || { updatedAt:{}, data:{} };
        STDEV_DOCS[p].data = STDEV_DOCS[p].data || {};
        STDEV_DOCS[p].updatedAt = STDEV_DOCS[p].updatedAt || {};
        STDEV_DOCS[p].data[ticker] = STDEV_DOCS[p].data[ticker] || {};
        for(const f of fields){ STDEV_DOCS[p].data[ticker][f] = liveStdev[ticker]?.[f] ?? null; }
        STDEV_DOCS[p].updatedAt[ticker] = ts;
        if(db) FB.saveStdev(p, STDEV_DOCS[p]);
      }
      return true;
    }catch(e){ console.log(`[stdev] error ${ticker} attempt ${attempt}:`, e); }
  }
  return false;
}
async function cleanStdevCache(){
  const active = new Set(HOLDINGS.map(h=>h.t).filter(t=>!CASH_TICKERS.includes(t)));
  for(const p of ['7d','30d','252d']){
    const doc = STDEV_DOCS[p];
    if(!doc?.data) continue;
    const removed = Object.keys(doc.data).filter(t=>!active.has(t));
    if(removed.length){
      console.log(`[stdev] cleanup ${p}:`, removed);
      removed.forEach(t=>{ delete doc.data[t]; delete doc.updatedAt[t]; delete liveStdev[t]; });
      if(db) await FB.saveStdev(p, doc);
    }
  }
}
async function fetchAllStdev(){
  if(!CONFIG.TWELVE_KEY){ return; }
  // 1. Load everything from Firebase and display immediately
  await loadAllStdevFromFirebase();
  render();
  // 2. Find which tickers are stale per period
  const stale7   = getStaleTickersForPeriod('7d');
  const stale30  = getStaleTickersForPeriod('30d');
  const stale252 = getStaleTickersForPeriod('252d');
  const staleAll = [...new Set([...stale7, ...stale30, ...stale252])];
  console.log('[stdev] stale tickers:', staleAll);
  if(staleAll.length === 0){ await cleanStdevCache(); return; }
  // 3. Mark stale red, fetch one by one (8s gap → Twelve Data 8/min), save after each
  staleAll.forEach(t => stdevStale.add(t));
  render();
  for(const t of staleAll){
    await fetchAndSaveStdevForTicker(t, stale7.includes(t), stale30.includes(t), stale252.includes(t));
    stdevStale.delete(t);
    render();
    await delay(8000);
  }
  await cleanStdevCache();
}

/* ============================================================================
   BOOT
   ============================================================================ */
(async function boot(){
  seedQuotes();
  render();
  const ok = await initFirebase();
  if(ok) await loadHoldingsFromFirestore();   // Firestore wins when a holdings doc exists
  render();
  // live market data (Finnhub) + Firebase-first std-dev (Twelve Data tops up stale)
  await fetchPrices();   // also refreshes the index strip
  fetchMetrics();
  fetchNews();
  fetchAllStdev();
  fetchRates();
})();
